spring.application.name=turnlook


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


# En deploy las credenciales salen de las variables de entorno. Los valores por
# defecto son los de la base de desarrollo, para poder correr el proyecto local.



spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
mercadopago.access-token=${MP_ACCESS_TOKEN}
jwt.secret=${JWT_SECRET}


resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Limites de carga de imagenes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

whatsapp.gateway.url=${WHATSAPP_GATEWAY_URL}
whatsapp.gateway.api-key=${WHATSAPP_GATEWAY_API_KEY}